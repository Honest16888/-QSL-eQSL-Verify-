# ---------------------------------------------------------------------------
#  Apache 虚拟主机示例
#  复制到 /etc/apache2/sites-available/qsl.conf
#  启用：a2enmod rewrite headers && a2ensite qsl && systemctl reload apache2
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName qsl.example.com              # ← 改成你的域名
    DocumentRoot /var/www/qsl/public        # ← 必须指向 public

    <Directory /var/www/qsl/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # 显式阻止访问非公开目录（双保险，即使 DocumentRoot 配错也不泄密）
    <Directory /var/www/qsl/config>
        Require all denied
    </Directory>
    <Directory /var/www/qsl/includes>
        Require all denied
    </Directory>
    <Directory /var/www/qsl/database>
        Require all denied
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/qsl-error.log
    CustomLog ${APACHE_LOG_DIR}/qsl-access.log combined
</VirtualHost>

