# ---------------------------------------------------------------------------
#  Nginx 站点配置示例
#  关键点：站点根目录必须指向 public/ ，其余目录（config/ includes/ database/）
#          不能被浏览器直接访问。
#  复制到 /etc/nginx/conf.d/qsl.conf 后：nginx -t && systemctl reload nginx
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name qsl.example.com;          # ← 改成你的域名

    root /var/www/qsl/public;             # ← 指向 public 目录
    index index.php;

    charset utf-8;
    client_max_body_size 4m;              # 略大于 config 里 upload.max_kb

    access_log /var/log/nginx/qsl.access.log;
    error_log  /var/log/nginx/qsl.error.log;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "same-origin" always;

    # 禁止访问隐藏文件与上传目录里的脚本
    location ~ /\.          { deny all; }
    location ~* /uploads/.*\.(php|phtml|phar|cgi|pl|py|sh)$ { deny all; }

    location = /favicon.ico { log_not_found off; access_log off; }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # 按实际环境调整：可能是 unix:/run/php/php8.2-fpm.sock
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|webp|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

# ---------------------------------------------------------------------------
#  启用 HTTPS（certbot 会自动改写）：
#    sudo certbot --nginx -d qsl.example.com
# ---------------------------------------------------------------------------
